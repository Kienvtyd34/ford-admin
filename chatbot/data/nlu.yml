version: "3.1"

nlu:
- intent: greet
  examples: |
    - xin chào
    - chào bạn
    - hello

- intent: ask_price
  examples: |
    - giá xe [everest](car_name)
    - ford [ranger](car_name) giá bao nhiêu
    - [territory](car_name) bao nhiêu tiền
    - cho tôi giá [explorer](car_name)
    - giá
    - bao nhiêu

- intent: ask_recommend
  examples: |
    - tôi có 1 tỷ
    - tầm 1 tỷ 5 mua xe gì
    - ngân sách 800 triệu
    - xe gia đình
    - xe 5 chỗ

- intent: goodbye
  examples: |
    - tạm biệt
    - bye