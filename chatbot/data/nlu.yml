version: "3.1"

nlu:

- intent: greet
  examples: |
    - xin chào
    - chào bạn
    - hello
    - hi
    - chào shop

- intent: ask_price
  examples: |
    - xe ranger giá bao nhiêu
    - ford everest giá nhiêu
    - giá xe explorer
    - ranger bao nhiêu tiền
    - cho tôi giá everest
