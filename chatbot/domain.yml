version: "3.1"

intents:
  - greet
  - ask_price
  - ask_recommend
  - goodbye

entities:
  - car_name

slots:
  car_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text

responses:
  utter_greet:
    - text: "Xin chào 👋 Tôi là chuyên viên tư vấn xe Ford. Bạn đang quan tâm dòng xe nào hoặc tầm giá bao nhiêu?"

  utter_goodbye:
    - text: "Tạm biệt bạn! 🚗"

  utter_ask_car:
    - text: "Bạn muốn hỏi xe nào?"

  utter_followup:
    - text: "👉 Bạn muốn xem giá, thông số hay đặt lịch lái thử?"

actions:
  - action_get_car_price
  - action_recommend_car